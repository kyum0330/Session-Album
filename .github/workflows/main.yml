name: Daily Music Prompt Generator

# 언제 실행할지 설정하는 부분입니다.
on:
  schedule:
    # 매 8시간마다(매시 정각) 실행됩니다. (하루 3회 x 3종 = 총 9곡)
    - cron: '0 */8 * * *'

  # 웹에서 수동으로 버튼을 눌러 전체 또는 원하는 스타일만 골라 실행할 수 있습니다.
  workflow_dispatch:
    inputs:
      target:
        description: '실행할 스크립트 선택'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - kpop
          - pop
          - jpop

jobs:
  generate-prompt:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TZ: 'Asia/Seoul'
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

    steps:
      # 1. 저장소에 있는 파일들(JSON, main.py, main_2.py, main_3.py 등)을 불러옵니다.
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v4

      # 2. 파이썬 환경을 세팅합니다.
      - name: Python 설치하기
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 필요한 외부 라이브러리(패키지)를 설치합니다.
      - name: 필요한 패키지 설치하기
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      # 4-1. 기본 K-Pop 스크립트 실행 (main.py)
      - name: "[1/3] K-Pop 프롬프트 생성 (main.py)"
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'kpop'
        continue-on-error: true
        run: python -u main.py

      # API RPM(분당 요청 수) 제한 보호를 위해 스크립트 간 짧은 대기
      - name: API 안정화 대기 (10초)
        if: github.event_name == 'schedule' || inputs.target == 'all'
        run: sleep 10

      # 4-2. English Pop 스크립트 실행 (main_2.py)
      - name: "[2/3] English Pop 프롬프트 생성 (main_2.py)"
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'pop'
        continue-on-error: true
        run: python -u main_2.py

      - name: API 안정화 대기 (10초)
        if: github.event_name == 'schedule' || inputs.target == 'all'
        run: sleep 10

      # 4-3. J-Pop 스크립트 실행 (main_3.py)
      - name: "[3/3] J-Pop 프롬프트 생성 (main_3.py)"
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'jpop'
        continue-on-error: true
        run: python -u main_3.py
